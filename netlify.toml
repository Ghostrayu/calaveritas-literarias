[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Send the old .com domain to the .tech domain (must stay above other rules)
[[redirects]]
  from = "https://tucalaverita.com/*"
  to = "https://tucalaverita.tech/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.tucalaverita.com/*"
  to = "https://tucalaverita.tech/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[dev]
  framework = "#custom"
  command = "vite"
  targetPort = 5173
  port = 8888
  autoLaunch = true
