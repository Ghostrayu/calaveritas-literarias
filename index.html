<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#23103a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Calaverita Generator</title>
    <style>
      html { background: #23103a; color-scheme: dark; }
      .wallpaper, .picado { display: none; }
    </style>
  </head>
  <body>
    <div class="wallpaper" aria-hidden="true">
      <svg class="pattern" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <g id="calavera">
            <path d="M34 52a26 26 0 1 1 52 0c0 10-4 16-9 19v9q0 5-5 5H48q-5 0-5-5v-9c-5-3-9-9-9-19z" fill="#f3e6d0" />
            <circle cx="49" cy="53" r="7.5" style="fill: var(--cuenca, #e4007c)" /><circle cx="49" cy="53" r="3" style="fill: var(--ojo, #00a6a6)" />
            <circle cx="71" cy="53" r="7.5" style="fill: var(--cuenca, #e4007c)" /><circle cx="71" cy="53" r="3" style="fill: var(--ojo, #00a6a6)" />
            <path d="M60 70l-4-5a2.6 2.6 0 0 1 4-3a2.6 2.6 0 0 1 4 3z" fill="#23103a" />
            <g stroke="#23103a" stroke-width="1.6" stroke-linecap="round">
              <path d="M47 78h26M51 75v6M55.5 75v6M60 75v6M64.5 75v6M69 75v6" />
            </g>
            <g fill="#f59e0b">
              <circle cx="60" cy="31" r="3.2" /><circle cx="54.5" cy="35" r="3" /><circle cx="65.5" cy="35" r="3" />
              <circle cx="57" cy="40.5" r="3" /><circle cx="63" cy="40.5" r="3" />
            </g>
            <circle cx="60" cy="36.5" r="2.4" fill="#e4007c" />
            <path d="M40 60q-3 4 0 8M80 60q3 4 0 8" stroke="#00a6a6" stroke-width="2" fill="none" stroke-linecap="round" />
          </g>
          <g id="flor">
            <circle r="24" fill="none" stroke="#f59e0b" stroke-width="8" stroke-dasharray="4 3" />
            <circle r="16" fill="none" stroke="#ffb534" stroke-width="7" stroke-dasharray="3.5 2.5" />
            <circle r="9" fill="#ffcf6e" /><circle r="4" fill="#d9570b" />
          </g>
          <g id="rombo"><path d="M0-8L8 0 0 8-8 0z" fill="#9bcb3b" /></g>
          <pattern id="tile" width="220" height="220" patternUnits="userSpaceOnUse">
            <use href="#calavera" x="10" y="8" />
            <use href="#flor" x="165" y="165" />
            <use href="#rombo" x="165" y="55" />
            <use href="#rombo" x="55" y="168" />
            <circle cx="110" cy="110" r="2.5" fill="#00a6a6" />
            <circle cx="0" cy="110" r="2.5" fill="#e4007c" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#tile)" />
      </svg>
      <div class="oscuridad"></div>
      <svg class="ojos" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="brillo"><stop offset="0" stop-color="#7fd0ff" stop-opacity="0.7" /><stop offset="1" stop-color="#3a7bff" stop-opacity="0" /></radialGradient>
          <pattern id="tile-ojos" width="220" height="220" patternUnits="userSpaceOnUse">
            <circle cx="59" cy="61" r="11" fill="url(#brillo)" /><circle cx="81" cy="61" r="11" fill="url(#brillo)" />
            <circle cx="59" cy="61" r="2.6" fill="#c8f3ff" /><circle cx="81" cy="61" r="2.6" fill="#c8f3ff" />
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#tile-ojos)" />
      </svg>
      <div class="sombra">
        <svg viewBox="0 0 200 420" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
          <path d="M118 50Q150 10 172 16Q152 30 128 60Z" />
          <path d="M108 48Q118 4 142 0Q128 24 118 52Z" />
          <circle cx="78" cy="56" r="10" /><circle cx="92" cy="48" r="9" /><circle cx="64" cy="64" r="7" />
          <path d="M70 80Q72 50 100 46Q128 50 130 80Z" />
          <ellipse cx="100" cy="80" rx="80" ry="13" />
          <ellipse cx="100" cy="102" rx="15" ry="18" />
          <rect x="94" y="114" width="12" height="16" />
          <path d="M82 128Q100 121 118 128L126 152Q120 172 113 192L152 330Q166 378 174 412Q100 404 26 412Q34 378 48 330L87 192Q80 172 74 152Z" />
          <path d="M83 130Q66 164 62 210Q61 220 68 220Q72 182 88 152Z" />
          <path d="M117 130Q134 164 138 210Q139 220 132 220Q128 182 112 152Z" />
        </svg>
      </div>
      <svg class="vigia" viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg">
        <g class="vigia__cabeza">
          <path d="M34 52a26 26 0 1 1 52 0c0 10-4 16-9 19v9q0 5-5 5H48q-5 0-5-5v-9c-5-3-9-9-9-19z" fill="#f3e6d0" />
          <circle cx="49" cy="53" r="8" fill="#0e1440" /><circle cx="71" cy="53" r="8" fill="#0e1440" />
          <g class="vigia__pupilas" fill="#9fe7ff">
            <circle cx="49" cy="53" r="3.2" /><circle cx="71" cy="53" r="3.2" />
          </g>
          <g class="vigia__parpados" fill="#f3e6d0">
            <rect x="40" y="44" width="18" height="18" /><rect x="62" y="44" width="18" height="18" />
          </g>
          <path d="M60 70l-4-5a2.6 2.6 0 0 1 4-3a2.6 2.6 0 0 1 4 3z" fill="#23103a" />
          <path d="M47 78h26M51 75v6M55.5 75v6M60 75v6M64.5 75v6M69 75v6" stroke="#23103a" stroke-width="1.6" stroke-linecap="round" />
        </g>
      </svg>
      <div class="velas" id="velas"></div>
      <div class="niebla"><div class="niebla__capa"></div><div class="niebla__capa niebla__capa--lenta"></div></div>
    </div>
    <div class="picado" aria-hidden="true"><svg id="picado" xmlns="http://www.w3.org/2000/svg"></svg></div>

    <div id="app"></div>
    <footer class="site-footer">
      <a href="https://github.com/Ghostrayu/calaveritas-literarias" target="_blank" rel="noopener noreferrer" data-i18n="footer.credit"></a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
